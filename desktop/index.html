<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mineradio 多功能补丁器</title>
<style>
:root{color-scheme:dark;--bg:#101114;--card:rgba(255,255,255,.06);--bd:rgba(255,255,255,.12);--txt:#eef4ff;--muted:rgba(238,244,255,.62);--ok:#7cf0bf;--warn:#ffd27a;--bad:#ff8b8b;--accent:#9db8cf}*{box-sizing:border-box}body{margin:0;font-family:"Microsoft YaHei UI","Segoe UI",sans-serif;background:linear-gradient(135deg,#101114,#17191f 56%,#0d0e11);color:var(--txt);min-height:100vh}.wrap{padding:26px;display:flex;flex-direction:column;gap:16px}.hero{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}.title{font-size:26px;font-weight:900}.developer{margin-top:5px;color:var(--ok);font-size:12px;font-weight:800}.sub{margin-top:7px;color:var(--muted);line-height:1.6}.pill{padding:7px 10px;border:1px solid var(--bd);border-radius:999px;color:var(--muted);font-size:12px;background:rgba(255,255,255,.04)}.card{border:1px solid var(--bd);background:var(--card);border-radius:14px;padding:16px;box-shadow:0 16px 42px rgba(0,0,0,.22)}.modules{display:grid;grid-template-columns:1fr 1fr;gap:10px}.module{display:flex;align-items:flex-start;gap:10px;padding:12px;border:1px solid var(--bd);border-radius:10px;background:rgba(255,255,255,.03);cursor:pointer}.module input{margin-top:3px;accent-color:var(--ok)}.module strong{display:block}.module small{display:block;margin-top:4px;color:var(--muted);line-height:1.4}.grid{display:grid;grid-template-columns:130px 1fr;gap:9px 12px;font-size:13px}.k{color:var(--muted)}.v{word-break:break-all}.status{font-weight:800}.status.ok{color:var(--ok)}.status.warn{color:var(--warn)}.status.bad{color:var(--bad)}.actions{display:flex;flex-wrap:wrap;gap:9px}.btn{height:38px;padding:0 14px;border:1px solid rgba(157,184,207,.36);border-radius:10px;background:rgba(157,184,207,.13);color:var(--txt);font-weight:800;cursor:pointer}.btn:hover{background:rgba(157,184,207,.22)}.btn.primary{background:linear-gradient(135deg,rgba(124,240,191,.22),rgba(157,184,207,.20));border-color:rgba(124,240,191,.45)}.btn.danger{background:rgba(255,139,139,.12);border-color:rgba(255,139,139,.38)}.btn:disabled{opacity:.42;cursor:not-allowed}.log{white-space:pre-wrap;line-height:1.55;color:var(--muted);font-size:12px;min-height:48px}.note{font-size:11px;color:rgba(238,244,255,.5);line-height:1.55}@media(max-width:680px){.wrap{padding:18px}.hero{display:block}.pill{display:inline-block;margin-top:10px}.modules{grid-template-columns:1fr}.grid{grid-template-columns:100px 1fr}}
</style></head>
<body><div class="wrap">
  <div class="hero"><div><div class="title">Mineradio 多功能补丁器</div><div class="developer">JIAFEE 开发</div><div class="sub">基于 Mineradio 2.2.0 源码的模块化注入工具。模块可独立安装、更新、卸载，也可以同时安装。</div></div><div class="pill">本地离线 · 事务回滚</div></div>
  <div class="card"><div class="k" style="margin-bottom:9px">功能模块</div><div class="modules">
    <label class="module"><input type="checkbox" data-module="jiafee-fx-v2" checked><span><strong>音效增强</strong><small>10 段均衡器、音效预设和独立音频处理资源</small></span></label>
    <label class="module"><input type="checkbox" data-module="jiafee-coplay2"><span><strong>一起听联机</strong><small>TCP/IP 双人同步、局域网发现、授权码、重连和互动状态</small></span></label>
  </div></div>
  <div class="card"><div class="grid"><div class="k">目标目录</div><div id="target" class="v">检测中…</div><div class="k">App 目录</div><div id="appdir" class="v">-</div><div class="k">源码版本</div><div id="version" class="v">-</div><div class="k">模块状态</div><div id="status" class="v status warn">未知</div><div class="k">检查结果</div><div id="reason" class="v">-</div></div></div>
  <div class="actions"><button id="choose" class="btn">选择源码/安装目录</button><button id="refresh" class="btn">检查兼容性</button><button id="install" class="btn primary">开始注入所选模块</button><button id="uninstall" class="btn danger">卸载所选模块</button><button id="open" class="btn">打开目录</button></div>
  <div class="card"><div id="log" class="log">准备就绪。</div></div>
  <div class="note">源码目录模式不会自动启动应用；安装目录模式会在操作前停止 Mineradio、完成事务校验后尝试重启。一起听的 ws 运行时随模块安装；未知版本、锚点缺失或备份失败时会停止并回滚。</div>
</div>
<script>
let current=null,modules=[];
const $=id=>document.getElementById(id), selected=()=>Array.from(document.querySelectorAll('[data-module]:checked')).map(x=>x.dataset.module);
function show(info){current=info||null;$('target').textContent=info&&info.targetDir||'-';$('appdir').textContent=info&&info.appDir||'-';$('version').textContent=info&&info.version||'-';const installed=info&&info.modules&&info.modules.filter(x=>x.installed).length;const bad=info&&!info.supported;const st=$('status');st.className='v status '+(bad?'bad':(installed?'ok':'warn'));st.textContent=!info?'未选择':(bad?'不可注入':(installed?'已安装 '+installed+' 个模块':'可注入'));$('reason').textContent=info&&(info.reason||info.message)||'-';$('install').disabled=!(info&&info.ok&&info.supported);$('uninstall').disabled=!(info&&info.ok&&installed);$('open').disabled=!(info&&info.ok)}
function log(t){$('log').textContent=t||''}
async function inspect(){if(!selected().length){log('请至少选择一个模块。');return}log('正在检查源码结构、版本、注入点和模块冲突…');try{show(current&&current.targetDir?await window.jiafeePatch.inspect(current.targetDir,selected()):await window.jiafeePatch.detect(selected()));const bad=current&&current.modules&&current.modules.find(x=>x.missing.length||x.payloadMissing.length||x.conflicts.length||x.anchorErrors.length);log(bad?'检查失败：'+bad.name+' '+[...bad.missing,...bad.payloadMissing,...bad.conflicts,...bad.anchorErrors].join(', '):(current&&current.reason)||'检查完成，可以执行所选操作。')}catch(e){show({ok:false,reason:'检查失败：'+(e.message||e)});log('检查失败：'+(e.message||e))}}
$('choose').onclick=async()=>{const info=await window.jiafeePatch.choose(selected());if(info){current=info;show(info);log(info.ok?'已选择目标目录。':info.reason)}};$('refresh').onclick=inspect;document.querySelectorAll('[data-module]').forEach(x=>x.onchange=inspect);
$('install').onclick=async()=>{if(!current)return;log('正在准备事务注入…');try{const info=await window.jiafeePatch.install(current.targetDir,selected());show(info);log(info.message||info.reason||'注入完成。')}catch(e){log('注入失败：'+(e.message||e))}};
$('uninstall').onclick=async()=>{if(!current)return;log('正在卸载所选模块并保留其他模块…');try{const info=await window.jiafeePatch.uninstall(current.targetDir,selected());show(info);log(info.message||info.reason||'卸载完成。')}catch(e){log('卸载失败：'+(e.message||e))}};$('open').onclick=async()=>{if(current)await window.jiafeePatch.openDir(current.targetDir)};
(async()=>{try{modules=await window.jiafeePatch.list();await inspect()}catch(e){log('补丁列表加载失败：'+(e.message||e))}})();
</script></body></html>
