<section id="together-presence-space" class="together-presence-space" hidden aria-label="一起听成员空间">
  <div class="together-presence-pair">
    <article class="together-presence-member" data-presence-slot="0">
      <button id="together-local-presence-avatar" class="together-presence-avatar together-presence-avatar-editable" data-presence-avatar type="button" title="更换我的头像" aria-label="更换我的头像"><span data-presence-initial>我</span></button>
      <strong data-presence-name>等待成员</strong>
      <small data-presence-status>连接中</small>
      <p class="together-expression" data-presence-expression hidden></p>
    </article>
    <div class="together-presence-link" aria-hidden="true"><i></i><span>♪</span></div>
    <article class="together-presence-member" data-presence-slot="1">
      <div class="together-presence-avatar" data-presence-avatar><span data-presence-initial>友</span></div>
      <strong data-presence-name>等待好友</strong>
      <small data-presence-status>未连接</small>
      <p class="together-expression" data-presence-expression hidden></p>
    </article>
  </div>
  <div class="together-expression-controls">
    <button id="together-expression-toggle" class="together-expression-toggle" type="button" aria-expanded="true" title="收起聊天输入" aria-label="收起聊天输入">∧</button>
    <form id="together-expression-form" class="together-expression-form">
      <input id="together-expression-input" maxlength="50" autocomplete="off" placeholder="分享此刻感受…" aria-label="发送一句感受">
      <button type="submit" title="发送" aria-label="发送"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 4 16 8-16 8 3-8-3-8Z"/><path d="M7 12h13"/></svg></button>
    </form>
  </div>
</section>
