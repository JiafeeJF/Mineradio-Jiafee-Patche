services:
  mineradio-together-relay:
    build:
      context: ..
      dockerfile: together-relay-server/Dockerfile
    image: mineradio-together-relay:2.3.0
    container_name: mineradio-together-relay
    restart: unless-stopped
    ports:
      - "${PUBLIC_PORT:-17861}:17861/tcp"
    environment:
      PORT: "17861"
      PUBLIC_ADDRESS: "${PUBLIC_ADDRESS:-}"
      ROOM_NAME: "${ROOM_NAME:-Mineradio 一起听中转}"
      AUTHORIZATION_CODE: "${AUTHORIZATION_CODE:?请在 .env 中设置 6 位授权码}"
      ALLOW_LAN_WITHOUT_AUTH: "${ALLOW_LAN_WITHOUT_AUTH:-false}"
      DEBUG: "${DEBUG:-false}"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    init: true
