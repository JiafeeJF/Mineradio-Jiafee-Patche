<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>一起听面板视觉检查</title>
  <style>
    :root {
      --home-accent-rgb: 124, 240, 191;
      --panel-glass-bg: rgba(18,20,24,.88);
      --panel-glass-shadow: 0 24px 72px rgba(0,0,0,.52);
      --panel-glass-filter: blur(32px) saturate(1.5);
      --panel-button-bg: rgba(120,120,128,.14);
    }
    * { box-sizing:border-box; }
    html,body { min-height:100%; margin:0; }
    body {
      overflow:hidden;
      color:#fff;
      background:#0b0d10;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei UI",sans-serif;
    }
    button,input { font-family:inherit; }
    button { cursor:pointer; }
    .preview-backdrop {
      position:fixed;
      inset:0;
      background:linear-gradient(160deg,#0b0d10,#171a20);
    }
    .preview-titlebar {
      position:fixed;
      top:12px;
      right:12px;
      height:44px;
      display:flex;
      align-items:center;
      gap:6px;
    }
    .desktop-mode-btn,.ctrl-btn,.preview-window-btn { height:30px; border:1px solid rgba(255,255,255,.08); border-radius:999px; background:rgba(4,8,10,.42); color:rgba(255,255,255,.72); }
    .desktop-mode-btn { min-width:78px; }
    .preview-window-btn { width:38px; border:0; border-radius:10px; }
    #preview-root { display:contents; }
  </style>
  <link rel="stylesheet" href="../payload/together-listen/together-index.css">
</head>
<body>
  <div class="preview-backdrop"></div>
  <div class="preview-titlebar"><button id="diy-mode-btn" class="desktop-mode-btn">DIY</button><main id="preview-root"></main><button class="preview-window-btn">−</button><button class="preview-window-btn">□</button><button class="preview-window-btn">×</button></div>
  <script>
    Promise.all([
      fetch('../payload/together-listen/index-entry.html').then(r => r.text()),
      fetch('../payload/together-listen/index-modal.html').then(r => r.text())
    ]).then(([entryHtml, modalHtml]) => {
      document.getElementById('preview-root').innerHTML = entryHtml + modalHtml;
      const modal = document.getElementById('together-modal');
      const control = document.getElementById('together-control');
      control.appendChild(modal);
      control.classList.add('open');
      modal.classList.add('show');
      modal.setAttribute('aria-hidden', 'false');
      document.getElementById('together-profile-name').value = 'JIAFEE';
      document.getElementById('together-lan-list').innerHTML = '<button class="together-server-row"><span><strong>客厅的 Mineradio</strong><small>192.168.1.8:17861</small></span><em>在线 · 12ms · 1/2</em></button>';
      document.getElementById('together-saved-list').innerHTML = '<div class="together-saved-row"><button><strong>远程音乐房</strong><small>music.example.com:17861 · 需授权码 · 在线 · 刚刚</small></button><button title="编辑">✎</button><button title="删除">×</button></div>';
      if (new URLSearchParams(location.search).get('room') === '1') {
        document.getElementById('together-lobby-view').hidden = true;
        document.getElementById('together-room-view').hidden = false;
        document.getElementById('together-host-info').hidden = false;
        document.getElementById('together-room-name').textContent = 'JIAFEE 的一起听世界';
        document.getElementById('together-room-state').textContent = '2/2 · 正在同步';
        document.getElementById('together-network-quality').dataset.quality = 'excellent';
        document.getElementById('together-network-quality').lastChild.textContent = ' 线路优秀';
        document.getElementById('together-members').innerHTML = '<span>JIAFEE</span><span>好友</span>';
        document.getElementById('together-share-address').textContent = '192.168.1.8:17861';
        document.getElementById('together-host-port').textContent = '17861';
        document.getElementById('together-host-auth-code').textContent = '482731';
        document.getElementById('together-now-title').textContent = '这首好听！';
        document.getElementById('together-now-artist').textContent = '双方播放进度已同步';
        document.getElementById('together-room-progress-fill').style.width = '62%';
      }
      document.querySelector('.together-panel').scrollTop = 0;
    });
  </script>
</body>
</html>
